name: Recorded practice cycle
on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recorded-practice-cycle
  cancel-in-progress: false
jobs:
  cycle:
    if: github.repository == 'Albertito-AI/atlas-open-mathematics' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify trusted source
        run: python3 -m unittest discover -s tests -v
      - name: Generate bounded practice and preserve evidence
        run: python3 scripts/research_cycle.py
      - name: Validate records
        run: python3 scripts/validate_repository.py
      - name: Commit evidence only
        run: |
          git config user.name 'Atlas research recorder'
          git config user.email 'actions@users.noreply.github.com'
          git add -- research/cycles
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record verified practice cycle (known mathematics)'
          git push origin HEAD:main
